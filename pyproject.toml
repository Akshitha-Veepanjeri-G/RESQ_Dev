[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resq-dev"
version = "0.1.0"
description = "Human-Supervised AI Verification & Repair Assistant for Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RESQ Dev Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
    "httpx>=0.24.0",
]
gemini = [
    "google-genai>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
